    <!-- CONTACTO -->
    <main>
        <section>
            <p class="sobretitulo">Estamos para ayudarte</p>
            <h1 class="subtitulo">Contacto</h1>
            <p>Completá el formulario o escribinos para cualquier consulta sobre tus experiencias en Buenos Aires.</p>
            
            <!-- Agregado action="./gracias.html" para redirigir al enviar -->
            <form action="./gracias.html" method="GET">
                <p>
                    <label for="nombre">Nombre:</label><br>
                    <input type="text" id="nombre" name="nombre">
                </p>
                <p>
                    <label for="email">Correo electrónico:</label><br>
                    <input type="email" id="email" name="email">
                </p>
                <p>
                    <label for="mensaje">Mensaje:</label><br>
                    <textarea id="mensaje" name="mensaje" rows="4"></textarea>
                </p>
                <button type="submit" class="boton-secundario">Enviar mensaje</button>
            </form>
        </section>
    </main>
